<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yana — About</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/index.css">
</head>
<body>

<div class="page">

  <div class="cover"></div>

  <!-- HEADER -->
  <div class="header-row">
    <div class="avatar-frame">
      <div class="avatar-inner" id="avatarWrap">
        <img src="../../img/pfp2.jpg" alt="Yana's profile photo" id="profileImg">
        <div class="avatar-fallback">
          <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.6">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"></path>
          </svg>
          <span>Add Photo</span>
        </div>
      </div>
    </div>
    <div class="identity">
      <div class="eyebrow">Student Profile</div>
      <h1 id="profileName">Haiana Peregrino</h1>
      <div class="subtitle" id="profileCourseYear">
        Information Technology Student · Xavier University — Ateneo de Cagayan
      </div>
      <a href="../Homepage/Index.html#editProfileSection" class="edit-profile-btn">
        Edit Profile
      </a>
    </div>
  </div>

  <!-- NAVIGATION TABBAR -->
  <nav class="tabbar">
    <a href="../Homepage/Index.html">Profile</a>
    <a href="../About/About.html" class="active">About</a>
    <a href="../Skills/Skills.html">Skills</a>
    <a href="../Projects/Projects.html">Projects</a>
    <a href="../Contacts/Contacts.html">Contact</a>
  </nav>

  <!-- BODY GRID CONTAINING ABOUT DATA -->
  <div class="body-grid">
    <section id="about" class="card">
      <div class="section-label">
        <div class="tick"></div>
        <h2>About Me</h2>
      </div>

      <!-- ABOUT ME -->
      <p class="intro-text" id="profileAbout"></p>

      <!-- INTERESTS -->
      <div class="info-block">
        <div class="info-label">Interests</div>
        <p class="intro-text" id="profileInterests"></p>
      </div>

      <!-- EDUCATIONAL BACKGROUND -->
      <div class="info-block">
        <div class="info-label">Educational Background</div>
        <p class="intro-text" id="profileEducation"></p>
      </div>

      <!-- GOALS & ASPIRATIONS -->
      <div class="info-block">
        <div class="info-label">Goals & Aspirations</div>
        <p class="intro-text" id="profileGoals"></p>
      </div>
    </section>
  </div>

  <footer>
    <div class="divider"></div>
    <p>© 2026 Yana<br>All rights reserved</p>
  </footer>

</div>

<!-- SCRIPT IMPORT -->
<script src="../../js/index.js"></script>
</body>
</html>
